[package]
name = "comstrx-api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
actix-web = "=4.15.0"
actix-cors = "=0.7.2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
